services:
  postgres:
    image: postgres:16
    env_file: "../.env"
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - ds_network

  pgadmin:
    image: dpage/pgadmin4
    env_file: "../.env"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - ds_network

networks:
  ds_network:
    name: ds_network
    driver: bridge
